# Checks every PR and push to main. release.yml reuses it (workflow_call)
# to verify a tag before releasing it.
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_call:
    inputs:
      tag:
        description: Release tag to check out and verify, e.g. v2026.10.0
        type: string
        required: true

concurrency:
  group: ci-${{ inputs.tag || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Sets init.defaultBranch for actions/checkout's `git init`, which
  # otherwise prints git's "Using 'master' as the name…" hint.
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main
  # wrangler (dry-run build, local D1) prints a telemetry notice otherwise.
  WRANGLER_SEND_METRICS: "false"

jobs:
  verify:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      # Installs the pnpm version in package.json's packageManager.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Versions match the tag
        if: inputs.tag
        run: node scripts/version.mjs check "${{ inputs.tag }}"
      - name: CHANGELOG has a section for the tag
        if: inputs.tag
        run: node scripts/release-notes.mjs "${{ inputs.tag }}" > /dev/null
      - run: pnpm audit
      - run: pnpm test
      - run: pnpm run lint
      - run: pnpm --filter @pernce/web run typecheck
      # The server's build as Vercel runs it (type-check of src/).
      - run: pnpm --filter @pernce/web run build
      # HTTP tests of the Hono app (in-memory libSQL) and of the Worker's
      # handlers over a local D1.
      - run: pnpm --filter @pernce/web test
      - run: pnpm run db:verify
      # The same sync checks on a local Cloudflare D1 (workerd, no login).
      - run: pnpm --filter @pernce/web run db:verify:d1
      # The API Worker's bundle, as `wrangler deploy` would upload it (no
      # login, nothing deployed).
      - run: pnpm --filter @pernce/web run build:worker
      - run: pnpm run core:build

  # mobile/ isn't in the pnpm workspace (its own React version, docs/mobile-scope.md
  # §4), so it installs and checks on its own. Its tests include the sync
  # client's multi-device merge tests against an in-memory server.
  mobile:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: mobile/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: mobile/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
      - run: pnpm run lint
      - run: pnpm test
      # The personal web export builds (the store one, with the landing page,
      # is built and checked by the site job).
      - name: Web export (personal)
        run: |
          APP_VARIANT=personal pnpm exec expo export --platform web --output-dir ../web/public
          node scripts/pwa.mjs ../web/public
          if ! grep -rlq '\\"variant\\":\\"personal\\"' ../web/public/_expo; then
            echo "personal export lacks the personal variant marker"; exit 1
          fi
          if [ ! -f ../web/public/index.html ] || [ -d ../web/public/app ]; then
            echo "the personal export must be the app at its root"; exit 1
          fi

  # pernce.com: the landing page at / and the store (offline-only) app at /app,
  # built into web/public-store/ and tested in a browser against the Cloudflare
  # Worker that serves it (wrangler dev, no login, nothing deployed).
  site:
    runs-on: ubuntu-24.04
    # The official Playwright image: its Chromium and fonts are what the
    # Linux screenshot baselines (web/tests/site/__screenshots__/chromium-linux)
    # were made with, so screenshots compare pixel for pixel. Keep the tag
    # equal to @playwright/test in web/package.json (checked below).
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-noble
      options: --ipc=host
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.sha }}
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Install the app's dependencies
        working-directory: mobile
        run: pnpm install --frozen-lockfile
      - name: Build pernce.com (landing page and store app)
        run: pnpm run build:store-app
      - name: The export is what the Worker expects
        run: |
          cd web/public-store
          grep -q '<h1' index.html || { echo "index.html is not the landing page"; exit 1; }
          grep -q 'Every currency' index.html || { echo "landing page copy missing"; exit 1; }
          [ -f app/index.html ] || { echo "app/index.html missing"; exit 1; }
          grep -q 'src="/app/_expo' app/index.html || { echo "the app does not load from /app"; exit 1; }
          [ ! -e _expo ] || { echo "app files at the root"; exit 1; }
          if ! grep -rlq '\\"variant\\":\\"store\\"' app/_expo; then
            echo "store export lacks the store variant marker"; exit 1
          fi
          if grep -rlq '\\"variant\\":\\"personal\\"' app/_expo; then
            echo "personal variant in store export"; exit 1
          fi
          [ -f _headers ] || { echo "store export has no _headers"; exit 1; }
          grep -q '^/app/\*' _headers || { echo "_headers is not scoped to /app/*"; exit 1; }
          if grep -q '^/\*' _headers; then echo "_headers still isolates every path"; exit 1; fi
          grep -q 'registration.unregister' sw.js || { echo "/sw.js is not the retire worker"; exit 1; }
      # The app Worker's bundle, as `wrangler deploy` would upload it.
      - run: pnpm --filter @pernce/web run build:store-worker
      - name: The Playwright image matches @playwright/test
        run: |
          want="Version $(node -p "require('./web/package.json').devDependencies['@playwright/test']")"
          have="$(pnpm --filter @pernce/web exec playwright --version)"
          [ "$have" = "$want" ] || { echo "image has $have, web/package.json wants $want: bump the container tag"; exit 1; }
      - run: pnpm run test:site
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: |
            web/playwright-report
            web/test-results
          retention-days: 7
