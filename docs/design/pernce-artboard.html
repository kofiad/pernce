<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pernce Artboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet">
<!--
  Pernce artboard — every web and mobile screen, each in dark and light.
  Tokens and component shapes are ported from pernce_design.md (the docs
  win if they ever disagree). Screens are generated from the templates in
  the <script> below: one template per screen, rendered once per mode. The
  mode only swaps the semantic variables in `.t-dark` / `.t-light`, so the
  token mapping table on the Foundations page is the whole difference
  between the two.

  Canvas: drag or scroll to pan, ⌘/Ctrl + scroll (or pinch) to zoom,
  Shift+1 fit page, Shift+2 zoom to selection, Shift+0 100%, 1–4 switch
  pages, D / L / B show dark / light / both.
-->
<style>
/* ===================== Design tokens (pernce_design.md) ===================== */
:root{
  --primary:#0b7a62; --primary-bright:#14a37f; --primary-deep:#085c4a; --on-primary:#fff;
  --ink:#161b1a; --body:#1d2422; --charcoal:#363e3c; --mute-c:#4e5957; --ash:#5b6563; --stone-c:#8b9694; --faint:#c7cecc;
  --canvas-light:#fff; --canvas-dark:#000; --surface-soft:#f2f5f4; --surface-deep:#0a0c0c; --surface-elevated:#151a19; --surface-tint:rgba(255,255,255,.08);
  --hairline-light:#dde3e1; --hairline-dark:rgba(255,255,255,.12); --divider-soft:rgba(255,255,255,.06);
  --teal:#0e8f8a; --blue-link:#2a63c7; --light-blue:#2b7fd4; --light-green:#3f8c2c; --green-text:#22661b;
  --yellow:#a68700; --warning:#df7a06; --pink:#d6325f; --danger:#d63a3a; --deep-red:#8f1b22; --brown:#8c6656; --slate:#5e6a7e;
  --r-sm:8px; --r-md:12px; --r-lg:20px; --r-xl:28px; --r-full:9999px;
  --font:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  --mono:'JetBrains Mono',ui-monospace,Menlo,monospace;

  /* studio chrome (not part of the product) */
  --ui-bg:#ffffff; --ui-panel:#ffffff; --ui-line:#e6e6e6; --ui-text:#1e1e1e; --ui-mute:#6b6b6b; --ui-hover:#f2f2f2;
  --ui-canvas:#e5e5e5; --ui-sel:#0d99ff; --ui-sec:rgba(255,255,255,.55); --ui-sec-line:rgba(0,0,0,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --ui-bg:#2c2c2c; --ui-panel:#2c2c2c; --ui-line:#3d3d3d; --ui-text:#f0f0f0; --ui-mute:#a0a0a0; --ui-hover:#383838;
    --ui-canvas:#1e1e1e; --ui-sec:rgba(255,255,255,.035); --ui-sec-line:rgba(255,255,255,.06);
  }
}
:root[data-theme="dark"]{
  --ui-bg:#2c2c2c; --ui-panel:#2c2c2c; --ui-line:#3d3d3d; --ui-text:#f0f0f0; --ui-mute:#a0a0a0; --ui-hover:#383838;
  --ui-canvas:#1e1e1e; --ui-sec:rgba(255,255,255,.035); --ui-sec-line:rgba(255,255,255,.06);
}

/* ===================== Semantic modes — the ONLY dark/light difference ===================== */
.t-dark{
  --bg:#000; --bg-2:#151a19; --card:#151a19; --card-b:transparent; --inset:#0a0c0c;
  --text:#fff; --mute:rgba(255,255,255,.72); --stone:#8b9694;
  --divider:rgba(255,255,255,.06); --hair:rgba(255,255,255,.12);
  --chip:rgba(255,255,255,.08); --chip-t:#fff; --chip-on:#fff; --chip-on-t:#161b1a;
  --btn:#fff; --btn-t:#000; --out:#fff; --soft:rgba(255,255,255,.08); --soft-t:#fff;
  --field:#151a19; --field-b:rgba(255,255,255,.12); --ph:#8b9694;
  --track:rgba(255,255,255,.1); --pos:#3f8c2c; --pos-t:#5fb04a; --neg:#d63a3a; --neg-t:#ff6f6f;
  --link:#5c9df0; --brand:#14a37f; --nav-active:#151a19; --backdrop:#151a19; --sheet:#000;
  --grid:rgba(255,255,255,.08); --muted-bar:#363e3c; --hover:rgba(255,255,255,.06);
  color-scheme:dark;
}
.t-light{
  --bg:#fff; --bg-2:#f2f5f4; --card:#fff; --card-b:#dde3e1; --inset:#f2f5f4;
  --text:#161b1a; --mute:#4e5957; --stone:#5b6563;
  --divider:#dde3e1; --hair:#dde3e1;
  --chip:#f2f5f4; --chip-t:#161b1a; --chip-on:#161b1a; --chip-on-t:#fff;
  --btn:#000; --btn-t:#fff; --out:#161b1a; --soft:#f2f5f4; --soft-t:#161b1a;
  --field:#fff; --field-b:#dde3e1; --ph:#8b9694;
  --track:rgba(0,0,0,.08); --pos:#3f8c2c; --pos-t:#22661b; --neg:#d63a3a; --neg-t:#8f1b22;
  --link:#2a63c7; --brand:#0b7a62; --nav-active:#f2f5f4; --backdrop:#c7cecc; --sheet:#fff;
  --grid:#dde3e1; --muted-bar:#c7cecc; --hover:rgba(0,0,0,.04);
  color-scheme:light;
}

/* ===================== Studio chrome ===================== */
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--ui-canvas);color:var(--ui-text);font-family:var(--font);font-size:12px;overflow:hidden;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit}
.studio{display:grid;grid-template-columns:248px 1fr 264px;grid-template-rows:48px 1fr;height:100vh}
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 12px;background:var(--ui-bg);border-bottom:1px solid var(--ui-line);z-index:5}
.brandmark{width:24px;height:24px;border-radius:7px;background:var(--primary);display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.file{display:flex;flex-direction:column;line-height:1.2}
.file b{font-size:13px;font-weight:600}.file span{color:var(--ui-mute);font-size:11px}
.tb-spacer{flex:1}
.tb-seg{display:flex;background:var(--ui-hover);border-radius:8px;padding:2px}
.tb-seg button{border:0;background:transparent;padding:6px 10px;border-radius:6px;cursor:pointer;font-size:12px;font-weight:500;color:var(--ui-mute)}
.tb-seg button[aria-pressed="true"]{background:var(--ui-bg);color:var(--ui-text);box-shadow:0 0 0 1px var(--ui-line)}
.tb-btn{border:1px solid var(--ui-line);background:var(--ui-bg);border-radius:8px;height:30px;padding:0 10px;cursor:pointer;display:inline-flex;align-items:center;gap:6px}
.tb-btn:hover{background:var(--ui-hover)}
.zoom{min-width:58px;justify-content:center;font-variant-numeric:tabular-nums}
.panel{background:var(--ui-panel);border-right:1px solid var(--ui-line);overflow:auto;z-index:4}
.panel.right{border-right:0;border-left:1px solid var(--ui-line)}
.p-sec{padding:12px 8px;border-bottom:1px solid var(--ui-line)}
.p-h{font-size:11px;font-weight:600;padding:4px 8px 8px;color:var(--ui-text)}
.p-item{display:flex;align-items:center;gap:8px;width:100%;text-align:left;border:0;background:transparent;padding:6px 8px;border-radius:6px;cursor:pointer;font-size:12px;color:var(--ui-text)}
.p-item:hover{background:var(--ui-hover)}
.p-item[aria-current="true"]{background:var(--ui-hover);font-weight:600}
.p-item .k{margin-left:auto;color:var(--ui-mute);font-size:11px}
.p-group{color:var(--ui-mute);font-size:11px;font-weight:600;padding:10px 8px 4px;display:flex;gap:6px;align-items:center}
.p-item.layer{padding-left:22px}
.p-item.layer.sel{background:rgba(13,153,255,.14)}
.dotm{width:9px;height:9px;border-radius:3px;flex-shrink:0;border:1px solid var(--ui-line)}
.insp{padding:14px 16px}
.insp h3{margin:0 0 2px;font-size:13px}
.insp .sub{color:var(--ui-mute);margin-bottom:14px}
.kv{display:grid;grid-template-columns:72px 1fr;gap:8px 10px;margin-bottom:16px}
.kv dt{color:var(--ui-mute)}.kv dd{margin:0;word-break:break-word}
.kv code{font-family:var(--mono);font-size:11px}
.insp p{color:var(--ui-mute);line-height:1.55;margin:0 0 10px}
.hint{font-size:11px;color:var(--ui-mute);line-height:1.7}
.hint kbd{font-family:var(--mono);font-size:10px;border:1px solid var(--ui-line);border-radius:4px;padding:0 4px;background:var(--ui-hover)}
.viewport{position:relative;overflow:hidden;cursor:grab;touch-action:none}
.viewport.panning{cursor:grabbing}
.world{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
.page{display:none;flex-direction:column;gap:360px;padding:400px}
.page.on{display:flex}
.sec{position:relative;background:var(--ui-sec);border:1px solid var(--ui-sec-line);border-radius:6px;padding:180px 96px 96px;width:max-content}
.sec-t{position:absolute;left:0;bottom:100%;margin-bottom:calc(10px / var(--k,1));font-size:max(40px, calc(14px / var(--k,1)));font-weight:600;white-space:nowrap;color:var(--ui-text)}
.sec-d{position:absolute;left:96px;top:48px;font-size:18px;color:var(--ui-mute);max-width:1100px;line-height:1.5}
.row-frames{display:flex;gap:160px;align-items:flex-start}
.pair{display:flex;gap:64px;align-items:flex-start}
.pair.v{flex-direction:column;gap:140px}
.fw{position:relative}
.fl{position:absolute;left:0;bottom:100%;margin-bottom:calc(6px / max(var(--k,1), .3));display:flex;gap:calc(6px / max(var(--k,1), .3));align-items:center;font-size:calc(11px / max(var(--k,1), .3));white-space:nowrap;color:var(--ui-mute);pointer-events:auto;cursor:pointer}
.fl b{color:var(--ui-text);font-weight:500}
.fw.sel > .frame{outline:calc(2px / var(--k,1)) solid var(--ui-sel)}
.fw.sel > .fl b{color:var(--ui-sel)}
.frame{position:relative;overflow:hidden;font-family:var(--font);background:var(--bg);color:var(--text);font-size:16px;line-height:1.5;letter-spacing:.24px;box-shadow:0 0 0 1px rgba(0,0,0,.06)}
body.hide-dark .fw[data-mode="dark"], body.hide-light .fw[data-mode="light"]{display:none}
@media (max-width:900px){.studio{grid-template-columns:1fr}.panel{display:none}.viewport{grid-column:1}}

/* ===================== Product type scale (Inter; 500 with negative tracking for display sizes) ===================== */
.frame .d-xl{font-size:80px;font-weight:500;line-height:1;letter-spacing:-.8px}
.frame .d-lg{font-size:48px;font-weight:500;line-height:1.21;letter-spacing:-.48px}
.frame .d-md{font-size:40px;font-weight:500;line-height:1.2;letter-spacing:-.4px}
.frame .h-lg{font-size:32px;font-weight:500;line-height:1.19;letter-spacing:-.32px}
.frame .h-md{font-size:24px;font-weight:500;line-height:1.33;letter-spacing:0}
.frame .h-sm{font-size:20px;font-weight:500;line-height:1.4;letter-spacing:0}
.frame .b-lg{font-size:18px;line-height:1.56;letter-spacing:-.09px}
.frame .b{font-size:16px;line-height:1.5;letter-spacing:.24px}
.frame .bb{font-size:16px;font-weight:600;line-height:1.5;letter-spacing:.16px}
.frame .sm{font-size:14px;line-height:1.43;letter-spacing:0}
.frame .smb{font-size:14px;font-weight:600;line-height:1.43;letter-spacing:0}
.frame .cap{font-size:13px;line-height:1.4;letter-spacing:0}
.frame .mono{font-family:var(--mono);letter-spacing:0}
.frame h1,.frame h2,.frame h3,.frame p{margin:0}
.mute{color:var(--mute)}.stone{color:var(--stone)}.pos{color:var(--pos-t)}.neg{color:var(--neg-t)}.link{color:var(--link);font-weight:600}
.num{font-variant-numeric:tabular-nums}

/* ===================== Product components ===================== */
.row{display:flex;align-items:center;justify-content:space-between;gap:12px}
.rs{display:flex;align-items:center;gap:12px}
.col{display:flex;flex-direction:column}
.grow{flex:1;min-width:0}
.i{width:20px;height:20px;flex-shrink:0;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;display:block}
.i.s{width:16px;height:16px;stroke-width:1.9}.i.xs{width:13px;height:13px;stroke-width:2.1}.i.l{width:28px;height:28px;stroke-width:1.6}.i.xl{width:40px;height:40px;stroke-width:1.4}
.av{width:42px;height:42px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;color:#fff;font-weight:600;font-size:13px;flex-shrink:0;letter-spacing:0}
.av.sm{width:36px;height:36px;font-size:12px}.av.lg{width:56px;height:56px;font-size:18px}.av.xs{width:24px;height:24px;font-size:10px}
.ib{width:44px;height:44px;border-radius:var(--r-full);display:inline-flex;align-items:center;justify-content:center;background:var(--soft);color:var(--soft-t);flex-shrink:0;border:0}
.ib.sm{width:36px;height:36px}
.ib.brand{background:var(--primary);color:#fff}
.card{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r-lg);padding:20px}
.card.p32{padding:32px}
.card.inset{background:var(--inset);border-color:transparent}
.chip{display:inline-flex;align-items:center;gap:6px;height:36px;padding:0 16px;border-radius:var(--r-full);font-size:14px;font-weight:600;white-space:nowrap;flex-shrink:0;background:var(--chip);color:var(--chip-t);letter-spacing:0}
.chip.on{background:var(--chip-on);color:var(--chip-on-t)}
.chip.ghost{background:transparent;border:1px solid var(--hair);color:var(--mute)}
.chips{display:flex;gap:8px;overflow:hidden}
.badge{display:inline-flex;align-items:center;gap:6px;padding:4px 12px;border-radius:var(--r-full);font-size:13px;line-height:1.4;background:var(--chip);color:var(--chip-t);white-space:nowrap;letter-spacing:0}
.badge.brand{background:var(--primary);color:#fff}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block;flex-shrink:0}
.btn{display:flex;align-items:center;justify-content:center;gap:8px;height:48px;padding:0 28px;border-radius:var(--r-full);font-size:16px;font-weight:600;letter-spacing:.24px;border:1px solid transparent;width:100%;white-space:nowrap}
.btn.auto{width:auto;display:inline-flex}
.btn.sm{height:36px;padding:0 16px;font-size:14px;letter-spacing:0}
.btn.p{background:var(--btn);color:var(--btn-t)}
.btn.o{background:transparent;border-color:var(--out);color:var(--text)}
.btn.s{background:var(--soft);color:var(--soft-t)}
.btn.brand{background:var(--primary);color:#fff}
.btn.danger{background:transparent;color:var(--neg-t);border-color:var(--hair)}
.btn.txt{background:transparent;color:var(--text);height:44px}
.lbl{font-size:12px;font-weight:600;letter-spacing:.4px;text-transform:uppercase;color:var(--stone);margin:28px 0 8px}
.fl-l{display:block;font-size:13px;font-weight:600;color:var(--mute);margin:0 0 8px;letter-spacing:0}
.in{height:56px;border-radius:var(--r-md);background:var(--field);border:1px solid var(--field-b);padding:0 16px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:16px;color:var(--text)}
.in.pl{color:var(--ph)}
.in.focus{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.in.err{border-color:var(--neg)}
.help{font-size:13px;color:var(--stone);margin-top:8px;letter-spacing:0}
.help.err{color:var(--neg-t)}
.field{margin-bottom:20px}
.seg{display:flex;background:var(--chip);border-radius:var(--r-full);padding:4px;gap:4px}
.seg span{flex:1;text-align:center;height:40px;display:flex;align-items:center;justify-content:center;border-radius:var(--r-full);font-size:14px;font-weight:600;color:var(--mute);letter-spacing:0}
.seg span.on{background:var(--chip-on);color:var(--chip-on-t)}
.tg{width:51px;height:31px;border-radius:var(--r-full);background:var(--track);position:relative;flex-shrink:0}
.tg::after{content:"";position:absolute;top:3px;left:3px;width:25px;height:25px;border-radius:50%;background:var(--stone)}
.tg.on{background:var(--text)}.tg.on::after{left:23px;background:var(--bg)}
.prog{height:8px;border-radius:var(--r-full);background:var(--track);overflow:hidden}
.prog > i{display:block;height:100%;border-radius:var(--r-full)}
.tx{display:flex;align-items:center;gap:12px;min-height:64px;border-bottom:1px solid var(--divider)}
.tx:last-child{border-bottom:0}
.tx-n{font-size:15px;font-weight:500;letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-s{font-size:13px;color:var(--stone);letter-spacing:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx-a{text-align:right;font-size:15px;font-weight:600;letter-spacing:0;font-variant-numeric:tabular-nums;white-space:nowrap}
.tx-a .tx-s{font-weight:400}
.li{display:flex;align-items:center;gap:12px;min-height:56px;border-bottom:1px solid var(--divider);font-size:15px;letter-spacing:0}
.li:last-child{border-bottom:0}
.li .v{margin-left:auto;color:var(--stone);display:flex;align-items:center;gap:6px;font-size:15px}
.group{background:var(--card);border:1px solid var(--card-b);border-radius:var(--r-lg);padding:0 16px}
.catc{display:flex;flex-direction:column;align-items:center;gap:6px;width:66px;flex-shrink:0}
.catc span{font-size:12px;color:var(--mute);text-align:center;letter-spacing:0}
.catc.on .av{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.catc.on span{color:var(--text);font-weight:600}
.swatches{display:flex;gap:12px;flex-wrap:wrap}
.sw{width:36px;height:36px;border-radius:50%}
.sw.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--text)}
.kpi .cap{color:var(--mute)}
.legend{display:flex;flex-direction:column;gap:10px}
.legend .row{font-size:14px;letter-spacing:0}
.legend .row.on{font-weight:600}.legend .row.dim{opacity:.4}
.dnut{position:relative;flex-shrink:0}
.dnut .ctr{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:0 20%;text-align:center;line-height:1.3}
.dnut .ctr>*{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.empty{display:flex;flex-direction:column;align-items:center;text-align:center;gap:12px;padding:48px 24px}
.empty .ring{width:72px;height:72px;border-radius:50%;background:var(--chip);display:grid;place-items:center;color:var(--mute)}
.note{display:flex;gap:10px;align-items:flex-start;font-size:13px;color:var(--mute);letter-spacing:0;line-height:1.45}
.code6{display:flex;gap:8px}
.code6 span{flex:1;height:60px;border-radius:var(--r-md);background:var(--field);border:1px solid var(--field-b);display:grid;place-items:center;font-size:24px;font-weight:500}
.code6 span.on{border-color:var(--text);box-shadow:0 0 0 1px var(--text)}
.rkey{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.rkey span{font-family:var(--mono);font-size:15px;text-align:center;padding:12px 0;border-radius:var(--r-sm);background:var(--inset);letter-spacing:.5px}
.chart-axis{font-size:12px;color:var(--stone);letter-spacing:0}
/* trend(): the scrub readout floats above the plot, centred on the finger, inverted like a toast */
.trend{position:relative}
.readout{position:absolute;width:196px;background:var(--text);color:var(--bg);border-radius:var(--r-md);padding:8px 10px;font-size:12px;line-height:1.35;letter-spacing:0;box-shadow:0 6px 20px rgba(0,0,0,.18);z-index:2}
.readout .rt{opacity:.72;margin-bottom:4px}
.readout .rr{display:flex;align-items:center;gap:6px;white-space:nowrap}
.readout .rr+.rr{margin-top:2px}
.readout i{width:10px;height:3px;border-radius:2px;flex-shrink:0}
.readout b{font-weight:600;font-variant-numeric:tabular-nums}
.readout span{opacity:.72}
.lkey{width:12px;height:2.5px;border-radius:2px;display:inline-block}

/* ---- mobile shell ---- */
.ph{width:390px;min-height:844px;display:flex;flex-direction:column}
.sbar{height:54px;display:flex;align-items:center;justify-content:space-between;padding:6px 32px 0 40px;font-size:16px;font-weight:600;flex-shrink:0;letter-spacing:0}
.sbar svg{display:block}
.pb{flex:1;padding:8px 20px 40px;display:flex;flex-direction:column}
.ph.tabbed .pb{padding-bottom:172px}
.navh{display:flex;align-items:center;justify-content:space-between;height:52px;margin:0 -8px 4px}
.navh .t{font-size:17px;font-weight:600;letter-spacing:0}
.tabbar{position:absolute;left:12px;right:12px;bottom:30px;display:flex;gap:8px;align-items:center}
.tabbar nav{flex:1;height:64px;background:var(--card);border:1px solid var(--hair);border-radius:var(--r-full);display:flex;align-items:center;padding:0 6px}
.tabbar .add{width:64px;height:64px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;flex-shrink:0}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--stone);font-size:11px;font-weight:600;line-height:14px;letter-spacing:0}
.tab .ind{width:52px;height:30px;border-radius:var(--r-full);display:grid;place-items:center}
.tab.on{color:var(--text)}.tab.on .ind{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--brand)}
.homeind{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);width:134px;height:5px;border-radius:3px;background:var(--text);opacity:.9}
.ph.sheet{background:var(--backdrop)}
.ph.sheet .sheetc{flex:1;margin-top:10px;background:var(--sheet);border-radius:var(--r-lg) var(--r-lg) 0 0;display:flex;flex-direction:column;border-top:1px solid var(--hair)}
.grab{width:36px;height:5px;border-radius:3px;background:var(--stone);opacity:.5;margin:8px auto 0}
.sheeth{display:flex;align-items:center;justify-content:space-between;padding:12px 12px 8px 20px}
.amount{text-align:center;padding:12px 0 8px}
.amount .d-md{font-variant-numeric:tabular-nums}
.hs{display:flex;gap:10px;overflow:hidden;margin:0 -20px;padding:0 20px}
.acard{width:172px;flex-shrink:0}
.qa{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.qa > div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;font-weight:500;letter-spacing:0;color:var(--mute)}
.qa .ib{width:52px;height:52px}
/* .addm: the add menu's 3-column grid of 52px plates over 12px labels (the .qa shape) */
.addm{display:grid;grid-template-columns:repeat(3,1fr);gap:20px 8px}
.addm > div{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:13px;font-weight:600;letter-spacing:0;color:var(--text);text-align:center}
.addm .ib{width:56px;height:56px}
/* .sw.custom: the last swatch, a hue ring around a plus; filled with the custom colour once one is picked */
.sw.custom{background:conic-gradient(red,#ff0,lime,cyan,blue,#f0f,red);display:grid;place-items:center;position:relative}
.sw.custom::before{content:"";position:absolute;inset:4px;border-radius:50%;background:var(--bg)}
.sw.custom .i{position:relative;color:var(--text)}
/* .wheel: hue by angle, saturation by radius; brightness is the slider under it */
.wheel{width:248px;height:248px;border-radius:50%;margin:8px auto 24px;position:relative;background:radial-gradient(circle closest-side,#fff,rgba(255,255,255,0) 100%),conic-gradient(from 90deg,red,#f0f,blue,cyan,lime,#ff0,red)}
.wheel .knob,.slider .knob{position:absolute;width:28px;height:28px;border-radius:50%;border:3px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.25),0 2px 6px rgba(0,0,0,.3);transform:translate(-50%,-50%)}
.slider{height:28px;border-radius:var(--r-full);position:relative;margin-bottom:24px}
.slider .knob{top:50%}
/* .icg: icon grid, 6 columns of 44px plates; .on is chip-on */
.icg{display:grid;grid-template-columns:repeat(6,1fr);gap:10px}
.icg .ib.on{background:var(--chip-on);color:var(--chip-on-t)}
.ph-sheet{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;flex-direction:column;justify-content:flex-end}
.sheetp{background:var(--sheet);border-radius:var(--r-lg) var(--r-lg) 0 0;border-top:1px solid var(--hair);padding:0 20px 42px}
.ph-alert{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;padding:40px}
.alertbox{background:var(--bg-2);border-radius:var(--r-lg);padding:24px;width:100%;text-align:center;border:1px solid var(--card-b)}

/* ---- web shell: the app in a browser at 768px and wider (pernce_design.md, Responsive Behavior) ---- */
.web{width:1440px;min-height:960px;display:grid;grid-template-columns:240px 1fr;position:relative}
.web.md{width:768px;min-height:1024px;grid-template-columns:72px 1fr}
.side{border-right:1px solid var(--hair);padding:24px 16px;display:flex;flex-direction:column;gap:4px}
.side > .btn{margin-bottom:20px}
.logo{display:flex;align-items:center;gap:10px;padding:0 12px 24px;font-size:20px;font-weight:600;letter-spacing:-.2px}
/* .sb: a sidebar item; .on is the dock's active tab stretched to a row (--brand at 18%, icon in --brand, label in --text) */
.sb{display:flex;align-items:center;gap:12px;height:44px;padding:0 14px;border-radius:var(--r-full);color:var(--stone);font-size:15px;font-weight:600;letter-spacing:0}
.sb.on{background:color-mix(in srgb,var(--brand) 18%,transparent);color:var(--text)}.sb.on .i{color:var(--brand)}
.side .who{margin-top:auto;display:flex;align-items:center;gap:10px;height:56px;padding:0 10px;border-radius:var(--r-full);font-size:14px;letter-spacing:0}
.side .who.on{background:color-mix(in srgb,var(--brand) 18%,transparent)}
/* .rail: 72px, the dock's tabs stacked; add button on top, profile at the bottom */
.rail{border-right:1px solid var(--hair);padding:20px 0 24px;display:flex;flex-direction:column;align-items:center;gap:16px}
.rail .add{width:48px;height:48px;border-radius:50%;background:var(--primary);color:#fff;display:grid;place-items:center;margin-bottom:12px}
.rail .tab{flex:none;width:72px}
.rail .who{margin-top:auto;padding:4px;border-radius:50%}
.rail .who.on{box-shadow:0 0 0 2px var(--bg),0 0 0 4px var(--brand)}
.wm{padding:40px 48px 64px;min-width:0}
.web.md .wm{padding:32px 32px 48px}
.wnarrow{max-width:720px;margin:0 auto}
.wtop{display:flex;align-items:center;justify-content:space-between;margin-bottom:28px;gap:16px;min-height:48px}
.crumb{font-size:14px;color:var(--stone);display:flex;align-items:center;gap:6px;margin-bottom:8px;letter-spacing:0}
.g2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:24px}
.g3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.g4{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:24px}
.g-main{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:24px}
/* .g-side: a detail page; the list grows, the summary column stays 360 */
.g-side{display:grid;grid-template-columns:minmax(0,1fr) 360px;gap:24px;align-items:start}
.tbl{width:100%;border-collapse:collapse;font-size:14px;letter-spacing:0}
.tbl th{text-align:left;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--stone);padding:0 12px 12px;border-bottom:1px solid var(--hair)}
.tbl td{padding:14px 12px;border-bottom:1px solid var(--divider);vertical-align:middle}
.tbl tr:last-child td{border-bottom:0}
.tbl .r{text-align:right}
.tbl .dayrow td{padding:20px 12px 8px;font-size:12px;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:var(--stone);border-bottom:0}
.search{height:44px;border-radius:var(--r-full);background:var(--chip);display:flex;align-items:center;gap:10px;padding:0 16px;color:var(--stone);font-size:14px;width:320px;letter-spacing:0}
/* pointer and keyboard states (web only): .hov is the hover fill, .kf the keyboard focus ring */
.hov,.tbl tr.hov td{box-shadow:inset 0 0 0 9999px var(--hover)}
.tx.hov,.li.hov{margin:0 -16px;padding:0 16px;border-radius:var(--r-md)}
.kf{outline:2px solid var(--brand);outline-offset:2px}
/* dialogs: the wide-screen form of sheets (forms 560, choices 440), over a 50% black dim */
.wdim{position:absolute;inset:0;background:rgba(0,0,0,.5);display:flex;align-items:center;justify-content:center;z-index:3}
.dlg{background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r-lg);width:560px;max-height:88%;display:flex;flex-direction:column;overflow:hidden}
.dlg.sm{width:440px}
.dlg-h{display:flex;align-items:center;justify-content:space-between;padding:20px 20px 4px 28px;flex-shrink:0}
.dlg-b{padding:16px 28px 8px;overflow:hidden;display:flex;flex-direction:column}
.dlg-f{display:flex;align-items:center;gap:12px;justify-content:flex-end;padding:16px 28px 24px;border-top:1px solid var(--divider);flex-shrink:0;margin-top:auto}
/* .pop: the add menu as a popover under the Add button; no dim, closes on outside click */
.pop{position:absolute;background:var(--sheet);border:1px solid var(--hair);border-radius:var(--r-lg);padding:20px 12px 16px;width:320px;z-index:3}
/* first run: storytelling band beside the form */
.wsplit{width:1440px;height:960px;display:grid;grid-template-columns:1fr 1fr}
.wsplit .band{background:var(--inset);padding:64px;display:flex;flex-direction:column;justify-content:space-between}
.wsplit .formside{display:flex;align-items:center;justify-content:center;padding:64px}

/* ---- foundations ---- */
.fd{width:1440px;padding:64px}
.swg{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:16px}
.swc{border-radius:var(--r-md);overflow:hidden;border:1px solid var(--hair)}
.swc .c{height:80px}
.swc .m{padding:10px 12px;font-size:12px;letter-spacing:0;line-height:1.5}
.swc .m b{display:block;font-size:13px}
.maptbl td,.maptbl th{padding:10px 12px}
.maptbl .sw2{display:inline-block;width:18px;height:18px;border-radius:5px;vertical-align:middle;margin-right:8px;border:1px solid rgba(128,128,128,.35)}
.typerow{display:grid;grid-template-columns:180px 1fr 220px;gap:24px;align-items:baseline;padding:16px 0;border-bottom:1px solid var(--divider)}

/* ---- site: the landing page at pernce.com/ (the app itself moves to /app) ---- */
.lp{width:1440px}
.lp.ph{width:390px;display:block;min-height:0}
.lp-in{width:1200px;margin:0 auto}
.lp.ph .lp-in{width:auto;margin:0 20px}
.lp-nav{height:80px;display:flex;align-items:center;gap:32px}
.lp.ph .lp-nav{height:64px;gap:12px}
.lp-nav .logo,.lp-foot .logo{padding:0}
.lp-nav .ln{font-size:15px;font-weight:600;color:var(--mute);letter-spacing:0}
.lp-sec{padding:120px 0 0}
.lp.ph .lp-sec{padding-top:72px}
.lp-hero{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:64px;align-items:center;padding:56px 0 0}
.lp.ph .lp-hero{display:block;padding-top:24px}
.lp-kick{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:600;color:var(--mute);letter-spacing:0}
/* .stage: the product shot. Inset band, the web app in a browser window bleeding off the right, the phone in front (always dark) */
.stage{position:relative;background:var(--inset);border-radius:var(--r-xl);height:640px;overflow:hidden}
.lp.ph .stage{height:440px;border-radius:var(--r-lg);margin-top:40px}
.shot{overflow:hidden;position:relative}
.shot > div{transform-origin:0 0;position:absolute;left:0;top:0}
.device{position:absolute;background:#161b1a;border-radius:48px;padding:9px}
.device .shot{border-radius:39px}
.store{display:inline-flex;align-items:center;gap:10px;height:52px;padding:0 20px 0 16px;border-radius:var(--r-full);border:1px solid var(--hair);color:var(--stone);letter-spacing:0}
.store b{display:block;font-size:14px;font-weight:600;color:var(--mute);line-height:1.2}
.store > span > span{display:block;font-size:11px;line-height:1.2;text-transform:uppercase;letter-spacing:.4px}
.ftabs{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.lp.ph .ftabs{justify-content:flex-start;flex-wrap:nowrap;overflow:hidden;margin:0 -20px;padding:0 20px}
.chip.lg{height:44px;padding:0 20px;font-size:15px;gap:8px}
.fpanel{margin-top:32px;background:var(--inset);border-radius:var(--r-xl);padding:56px;display:grid;grid-template-columns:minmax(0,.85fr) minmax(0,1.15fr);gap:56px;align-items:center}
.lp.ph .fpanel{display:flex;flex-direction:column;align-items:stretch;gap:28px;padding:24px 20px;border-radius:var(--r-lg);margin-top:20px}
.acc{display:flex;flex-direction:column}
.acc-i{padding:16px 0 16px 24px;border-left:2px solid var(--hair)}
.acc-i.on{border-left-color:var(--brand);padding:24px 0 24px 24px}
.lp.ph .acc-i{padding:12px 0 12px 16px}.lp.ph .acc-i.on{padding:16px 0 16px 16px}
.pt{display:flex;gap:16px;align-items:flex-start}
.pt .ib{width:44px;height:44px}
.band2 .pt .ib{background:var(--card)}
.band2{background:var(--inset);border-radius:var(--r-xl);padding:64px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.1fr);gap:64px;align-items:center}
.lp.ph .band2{display:block;padding:32px 24px;border-radius:var(--r-lg)}
.repo .li{font-size:14px}
.lp-foot{border-top:1px solid var(--divider);margin-top:120px;padding:32px 0 48px;display:flex;align-items:center;gap:32px}
.lp.ph .lp-foot{margin-top:72px;flex-direction:column;align-items:flex-start;gap:20px}

/* charts */
/* donut(): `sel` (an index into segs) is the picked slice: the others dim
   to 30% and the hole shows its name, amount and share, with a "View" link
   to its spending (none for Other or Uncategorized). */
function donut(segs, size = 132, sw = 16, sel = null) {
  const r = (size - sw) / 2, cx = size / 2, Cc = 2 * Math.PI * r; let off = 0;
  const arcs = segs.map((s, i) => { const len = Cc * s.v / 100; const a = `<circle cx="${cx}" cy="${cx}" r="${r}" fill="none" stroke="${s.c}" stroke-width="${sw}" stroke-dasharray="${Math.max(len - 2, 0)} ${Cc}" stroke-dashoffset="${-off}"${sel !== null && i !== sel ? ' opacity=".3"' : ''}/>`; off += len; return a; }).join('');
  const svg = `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><g transform="rotate(-90 ${cx} ${cx})">${arcs}</g></svg>`;
  if (sel === null) return svg;
  const k = segs[sel];
  return `<div class="dnut" style="width:${size}px;height:${size}px">${svg}<div class="ctr"><span class="cap mute">${k.n}</span><span class="${size > 150 ? 'h-sm' : 'bb'} num">${SPEND_AMT[sel]}</span><span class="cap"><span class="mute num">${k.v}%</span>${k.n === 'Other' ? '' : ` · <span class="link">View</span>`}</span></div></div>`;
}
const SPEND = [{n:'Food & Dining',v:34,c:C.warn},{n:'Transport',v:22,c:C.lblue},{n:'Shopping',v:18,c:C.pink},{n:'Bills & Utilities',v:14,c:C.teal},{n:'Entertainment',v:8,c:C.yellow},{n:'Health',v:4,c:C.brown}];
const SPEND_AMT = ['$505.58', '$327.14', '$267.66', '$208.18', '$118.96', '$59.48'];
const legend = (amts, sel = null) => `<div class="legend grow">${SPEND.map((s, i) => `<div class="row${sel === null ? '' : i === sel ? ' on' : ' dim'}"><span class="rs" style="gap:8px"><span class="dot" style="background:${s.c}"></span>${s.n}</span><span class="num mute">${amts ? amts[i] + ' · ' : ''}${s.v}%</span></div>`).join('')}</div>`;
function bars(w, h) {
  const d = [[1.9,1.4],[2.2,1.6],[2.0,1.7],[2.5,1.6],[2.3,1.8],[2.14,1.49]], m = 2.8, n = d.length;
  const gw = w / n, bw = Math.min(18, gw / 3.2);
  let s = `<svg width="100%" height="${h + 22}" viewBox="0 0 ${w} ${h + 22}" preserveAspectRatio="none" aria-hidden="true">`;
  [0, .5, 1].forEach(f => s += `<line x1="0" x2="${w}" y1="${h - h * f + .5}" y2="${h - h * f + .5}" stroke="var(--grid)"/>`);
  d.forEach((p, i) => { const x = i * gw + gw / 2; const h1 = h * p[0] / m, h2 = h * p[1] / m;
    s += `<rect x="${x - bw - 2}" y="${h - h1}" width="${bw}" height="${h1}" rx="3" fill="${C.primary}"/><rect x="${x + 2}" y="${h - h2}" width="${bw}" height="${h2}" rx="3" fill="var(--muted-bar)"/>`;
    s += `<text x="${x}" y="${h + 17}" text-anchor="middle" font-size="12" fill="var(--stone)" font-family="Inter">${['Apr','May','Jun','Jul','Aug','Sep'][i]}</text>`; });
  return s + '</svg>';
}
function line(w, h, pts = [70, 62, 64, 50, 42, 28, 14], fill = true) {
  const n = pts.length, xs = pts.map((_, i) => i * w / (n - 1)), ys = pts.map(p => p * h / 90);
  const poly = xs.map((x, i) => `${x.toFixed(1)},${ys[i].toFixed(1)}`).join(' ');
  return `<svg width="100%" height="${h}" viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" aria-hidden="true">${[.25,.5,.75].map(f => `<line x1="0" x2="${w}" y1="${h * f}" y2="${h * f}" stroke="var(--grid)"/>`).join('')}${fill ? `<polygon points="0,${h} ${poly} ${w},${h}" fill="${C.primary}" opacity=".12"/>` : ''}<polyline points="${poly}" fill="none" stroke="${C.primary}" stroke-width="2.5" vector-effect="non-scaling-stroke" stroke-linejoin="round"/><circle cx="${xs[n-1]}" cy="${ys[n-1]}" r="4" fill="${C.primary}"/></svg>`;
}
const exposure = () => `<div style="display:flex;height:12px;border-radius:9999px;overflow:hidden;gap:2px;margin-bottom:14px"><i style="width:85%;background:${C.primary}"></i><i style="width:8%;background:${C.teal}"></i><i style="width:5%;background:${C.pink}"></i><i style="width:1.2%;background:${C.yellow}"></i><i style="width:1%;background:${C.warn}"></i></div>
  <div class="legend">${[['USD','$16,533.55',85,C.primary],['XOF','$1,513.00',8,C.teal],['CAD','$933.43',5,C.pink],['GHS','$291.13',1.6,C.yellow],['XAF','$227.84',1.2,C.warn]].map(r => `<div class="row"><span class="rs" style="gap:8px"><span class="dot" style="background:${r[3]}"></span>${r[0]}</span><span class="num mute">${r[1]} · ${r[2]}%</span></div>`).join('')}</div>`;

/* trend(): line chart for change over time (Money in vs out, Net worth).
   Gridlines sit on round values, labelled short ($1k) in a 40px right
   gutter so labels never cover data; day or month labels underneath.
   One series: 2.5px brand line, fading fill, dot on the latest point.
   Several: 2px lines, legend with line keys. The axis starts at 0 unless
   `fit` (net worth); the fill fades out so it doesn't imply a zero base.
   `slots` > points leaves the rest of a part-finished month empty.
   `at` draws the scrub state: crosshair, ringed dots and the readout. */
const short = v => (v < 0 ? '−' : '') + '$' + (Math.abs(v) >= 1e3 ? +(Math.abs(v) / 1e3).toFixed(Math.abs(v) >= 1e4 ? 0 : 1) + 'k' : Math.round(Math.abs(v)));
const money = v => (v < 0 ? '−' : '') + '$' + Math.abs(v).toLocaleString('en-US', {minimumFractionDigits: 2, maximumFractionDigits: 2});
function niceTicks(lo, hi, n = 3) {
  if (hi <= lo) hi = lo + 1;
  const raw = (hi - lo) / n, p = 10 ** Math.floor(Math.log10(raw)), f = raw / p;
  const step = (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p, out = [];
  for (let v = Math.floor(lo / step) * step; v <= Math.ceil(hi / step) * step + step / 2; v += step) out.push(v);
  return out;
}
function trend(w, o) {
  const h = o.h || 140, T = 8, pw = w - 40, n = o.series[0].v.length, slots = o.slots || n, one = o.series.length === 1;
  const x = i => 4 + i * (pw - 8) / (slots - 1);
  const all = o.series.flatMap(s => s.v), ticks = niceTicks(o.fit ? Math.min(...all) : 0, Math.max(...all));
  const y0 = ticks[0], y1 = ticks[ticks.length - 1], y = v => T + h - (v - y0) / (y1 - y0) * h;
  const P = vs => vs.map((v, i) => `${x(i).toFixed(1)},${y(v).toFixed(1)}`);
  let s = `<svg width="${w}" height="${T + h + 24}" viewBox="0 0 ${w} ${T + h + 24}" style="display:block;width:100%;height:auto;overflow:visible" aria-hidden="true">`;
  ticks.forEach(t => { const gy = Math.round(y(t)) + .5; s += `<line x1="0" x2="${pw}" y1="${gy}" y2="${gy}" stroke="var(--grid)"/><text x="${w}" y="${gy + 4}" text-anchor="end" font-size="11" fill="var(--stone)" font-family="Inter" style="font-variant-numeric:tabular-nums">${short(t)}</text>`; });
  o.axis.forEach(([i, t]) => { const ax = x(i), a = ax < 14 ? 'start' : ax > pw - 14 ? 'end' : 'middle'; s += `<text x="${a === 'start' ? 0 : a === 'end' ? pw : ax}" y="${T + h + 18}" text-anchor="${a}" font-size="12" fill="var(--stone)" font-family="Inter">${t}</text>`; });
  if (one) { const p = P(o.series[0].v); s += `<defs><linearGradient id="trend-fill" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="${C.primary}" stop-opacity=".16"/><stop offset="1" stop-color="${C.primary}" stop-opacity="0"/></linearGradient></defs><path d="M${p.join('L')}L${x(n - 1)},${T + h}L${x(0)},${T + h}Z" fill="url(#trend-fill)"/>`; }
  o.series.forEach(sr => s += `<polyline points="${P(sr.v).join(' ')}" fill="none" stroke="${sr.c}" stroke-width="${one ? 2.5 : 2}" stroke-linejoin="round" stroke-linecap="round"/>`);
  if (one && o.at == null) s += `<circle cx="${x(n - 1)}" cy="${y(o.series[0].v[n - 1])}" r="4" fill="${C.primary}" stroke="var(--card)" stroke-width="2"/>`;
  let tip = '';
  if (o.at != null) {
    const i = o.at, cx = x(i);
    s += `<line x1="${cx}" x2="${cx}" y1="${T}" y2="${T + h}" stroke="var(--text)" stroke-opacity=".35"/>`;
    o.series.forEach(sr => s += `<circle cx="${cx}" cy="${y(sr.v[i])}" r="4" fill="${sr.c}" stroke="var(--card)" stroke-width="2"/>`);
    const rows = o.series.map(sr => `<div class="rr"><i style="background:${sr.c}"></i><b>${money(sr.v[i])}</b><span>${sr.n}</span></div>`).join('')
      + (o.extra ? o.extra(i) : []).map(([v, t]) => `<div class="rr"><b>${v}</b><span>${t}</span></div>`).join('');
    tip = `<div class="readout" style="left:${Math.max(0, Math.min(cx - 98, w - 196)).toFixed(0)}px;bottom:${h + 32}px"><div class="rt">${o.title(i)}</div>${rows}</div>`;
  }
  return `<div class="trend">${s}</svg>${tip}</div>`;
}
/* Sep 1–14 as running totals, from the sample transactions above. */
const run = ev => { let t = 0; return Array.from({length: 14}, (_, i) => t += ev[i + 1] || 0); };

    : `<aside class="side"><div class="logo">${mark(32)}Pernce</div>${btn('Add', 'brand', 'plus')}${WNAV.map(([i, t]) => `<span class="sb ${t === active ? 'on' : ''}">${I(i)}${t}</span>`).join('')}<div class="who ${active === 'Settings' ? 'on' : ''}">${av(C.primary, 'A', 'sm')}<div class="grow"><div style="font-weight:600">Ama Mensah</div><div class="cap stone">Settings</div></div>${I('gear', 's')}</div></aside>`;
  return `<div class="web ${o.md ? 'md' : ''}">${nav}<main class="wm">${o.narrow ? `<div class="wnarrow">${body}</div>` : body}</main>${o.overlay || ''}</div>`;
}

/* ---- view state ---- */
const store = {get(k){try{return JSON.parse(localStorage.getItem('pernce-artboard:' + k))}catch(e){return null}}, set(k, v){try{localStorage.setItem('pernce-artboard:' + k, JSON.stringify(v))}catch(e){}}};
let view = {x:0, y:0, k:.2}, page = store.get('page') || 'mobile', sel = null;
const views = store.get('views') || {};
function apply() {
  world.style.transform = `translate(${view.x}px,${view.y}px) scale(${view.k})`;
  world.style.setProperty('--k', view.k);
  document.getElementById('zlabel').textContent = Math.round(view.k * 100) + '%';
  views[page] = view; store.set('views', views);
}
function zoomAt(f, cx, cy) {
  const k = Math.min(4, Math.max(.02, view.k * f)); const r = k / view.k;
  view = {x: cx - (cx - view.x) * r, y: cy - (cy - view.y) * r, k}; apply();
}
function offsetIn(el) { let x = 0, y = 0; while (el && el !== world) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; } return {x, y}; }
function fitRect(x, y, w, h, pad = 80, max = 1) {
  const W = vp.clientWidth, H = vp.clientHeight;
  const k = Math.min(max, (W - pad * 2) / w, (H - pad * 2) / h);
  view = {k, x: (W - w * k) / 2 - x * k, y: (H - h * k) / 2 - y * k}; apply();
}
function fitPage() {
  const el = document.getElementById('pg-' + page);
  const secs = [...el.querySelectorAll('.sec')];
  let x0 = 1e9, y0 = 1e9, x1 = -1e9, y1 = -1e9;
  secs.forEach(s => { const o = offsetIn(s); x0 = Math.min(x0, o.x); y0 = Math.min(y0, o.y - 60); x1 = Math.max(x1, o.x + s.offsetWidth); y1 = Math.max(y1, o.y + s.offsetHeight); });
  fitRect(x0, y0, x1 - x0, y1 - y0, 40);
}
function zoomTo(key) {
  const fw = document.querySelector(`.fw[data-key="${key}"]`); if (!fw || fw.offsetParent === null) return;
  const o = offsetIn(fw); fitRect(o.x, o.y - 30, fw.offsetWidth, fw.offsetHeight + 30, 48, 1);
}

function renderInsp() {
  const el = document.getElementById('insp');
  const hint = `<div class="hint"><b>Navigate</b><br>Drag or scroll to pan · <kbd>⌘</kbd>/<kbd>Ctrl</kbd>+scroll or pinch to zoom<br><kbd>⇧1</kbd> fit page · <kbd>⇧2</kbd> zoom to selection · <kbd>⇧0</kbd> 100%<br><kbd>1</kbd>–<kbd>4</kbd> pages · <kbd>D</kbd> <kbd>L</kbd> <kbd>B</kbd> dark / light / both<br>Click a frame to inspect, double-click to zoom.</div>`;
  if (!sel || !byKey[sel]) {
    const total = (M.length + W.length + F.length) * 2;
    el.innerHTML = `<h3>Pernce artboard</h3><div class="sub">${total} frames · ${M.length} mobile + ${W.length} web screens, each in dark and light</div><p>Source of truth: <code class="mono">docs/design/pernce_design.md</code>. When code and this file disagree, the docs win.</p><p>Mobile frames are 390 wide (iPhone 15); web frames are 1440 wide. Frames show full scroll height.</p>${hint}`;
    return;
  }
  const s = byKey[sel]; const fw = document.querySelector(`.fw[data-key="${sel}"]`);
  el.innerHTML = `<h3>${s.id} ${s.name}</h3><div class="sub">${s.mode === 'dark' ? 'Dark' : 'Light'} · ${PAGES.find(p => p.id === s.page).name} / ${s.sec}</div>
  <dl class="kv"><dt>Size</dt><dd>${fw.offsetWidth} × ${fw.querySelector('.frame').offsetHeight}</dd><dt>Mode</dt><dd><code>.t-${s.mode}</code></dd><dt>Source</dt><dd><code>${s.src}</code></dd></dl><p>${s.notes}</p>
  <button type="button" class="tb-btn" id="other">Show ${s.mode === 'dark' ? 'light' : 'dark'} version</button><div style="height:20px"></div>${hint}`;
  document.getElementById('other').onclick = () => selectFrame(`${s.id}-${s.mode === 'dark' ? 'light' : 'dark'}`, true);
}
function selectFrame(key, zoom) {
  sel = key;
  document.querySelectorAll('.fw.sel').forEach(e => e.classList.remove('sel'));
  if (key) { const fw = document.querySelector(`.fw[data-key="${key}"]`); fw && fw.classList.add('sel'); }
  renderLayers(); renderInsp();
  if (zoom && key) zoomTo(key);
}
function setPage(id) {
  page = id; store.set('page', id);
  document.querySelectorAll('.page').forEach(p => p.classList.toggle('on', p.id === 'pg-' + id));
  sel = null; renderPages(); renderLayers(); renderInsp();
  if (views[id]) { view = views[id]; apply(); } else requestAnimationFrame(fitPage);
}
function setShow(m) {
  document.body.classList.toggle('hide-dark', m === 'light');
  document.body.classList.toggle('hide-light', m === 'dark');
  document.querySelectorAll('[data-show]').forEach(b => b.setAttribute('aria-pressed', b.dataset.show === m));
  if (sel && byKey[sel] && ((m === 'dark' && byKey[sel].mode === 'light') || (m === 'light' && byKey[sel].mode === 'dark'))) sel = null;
  renderLayers(); renderInsp(); store.set('show', m);
}

/* ---- events ---- */
document.getElementById('pages').addEventListener('click', e => { const b = e.target.closest('[data-page]'); b && setPage(b.dataset.page); });
document.getElementById('layers').addEventListener('click', e => { const b = e.target.closest('[data-key]'); b && selectFrame(b.dataset.key, true); });
document.querySelectorAll('[data-show]').forEach(b => b.onclick = () => setShow(b.dataset.show));
const ctr = () => [vp.clientWidth / 2, vp.clientHeight / 2];
document.getElementById('zin').onclick = () => zoomAt(1.25, ...ctr());
document.getElementById('zout').onclick = () => zoomAt(.8, ...ctr());
document.getElementById('zlabel').onclick = () => zoomAt(1 / view.k, ...ctr());
document.getElementById('zfit').onclick = fitPage;
document.getElementById('uitheme').onclick = () => {
  const r = document.documentElement, dark = r.dataset.theme ? r.dataset.theme === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches;
  r.dataset.theme = dark ? 'light' : 'dark'; store.set('ui', r.dataset.theme);
};
vp.addEventListener('wheel', e => {
  e.preventDefault();
  const r = vp.getBoundingClientRect();
  if (e.ctrlKey || e.metaKey) zoomAt(Math.exp(-e.deltaY * .01), e.clientX - r.left, e.clientY - r.top);
  else { view.x -= e.deltaX; view.y -= e.deltaY; apply(); }
}, {passive: false});
let drag = null;
vp.addEventListener('pointerdown', e => { if (e.button > 1) return; drag = {x: e.clientX, y: e.clientY, vx: view.x, vy: view.y, moved: false}; vp.setPointerCapture(e.pointerId); });
vp.addEventListener('pointermove', e => {
  if (!drag) return; const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  drag.moved = true; vp.classList.add('panning'); view.x = drag.vx + dx; view.y = drag.vy + dy; apply();
});
vp.addEventListener('pointerup', e => {
  if (drag && !drag.moved) { const fw = document.elementsFromPoint(e.clientX, e.clientY).map(n => n.closest && n.closest('.fw')).find(Boolean); selectFrame(fw ? fw.dataset.key : null); }
  drag = null; vp.classList.remove('panning');
});
vp.addEventListener('dblclick', e => { const fw = e.target.closest('.fw'); fw && selectFrame(fw.dataset.key, true); });
addEventListener('keydown', e => {
  if (e.target.closest && e.target.closest('input,textarea')) return;
  if (e.shiftKey && e.code === 'Digit1') fitPage();
  else if (e.shiftKey && e.code === 'Digit2') sel && zoomTo(sel);
  else if (e.shiftKey && e.code === 'Digit0') zoomAt(1 / view.k, ...ctr());
  else if (!e.shiftKey && ['1','2','3','4'].includes(e.key)) setPage(PAGES[+e.key - 1].id);
  else if (e.key === '=' || e.key === '+') zoomAt(1.25, ...ctr());
  else if (e.key === '-') zoomAt(.8, ...ctr());
  else if (e.key === 'd' || e.key === 'D') setShow('dark');
  else if (e.key === 'l' || e.key === 'L') setShow('light');
  else if (e.key === 'b' || e.key === 'B') setShow('both');
  else if (e.key === 'Escape') selectFrame(null);
});
addEventListener('resize', () => apply());

const ui = store.get('ui'); if (ui) document.documentElement.dataset.theme = ui;
setShow(store.get('show') || 'both');
const startPage = PAGES.some(p => p.id === page) ? page : 'mobile';
document.fonts && document.fonts.ready.then(() => { if (sel) zoomTo(sel); else if (!views[page]) fitPage(); });
setPage(startPage);
/* deep link: pernce-artboard.html#M05-light selects and zooms to that frame */
function fromHash() {
  const key = decodeURIComponent(location.hash.slice(1)); const s = byKey[key];
  if (!s) return;
  if (s.page !== page) setPage(s.page);
  setShow('both'); requestAnimationFrame(() => selectFrame(key, true));
}
addEventListener('hashchange', fromHash); fromHash();
</script>
</body>
